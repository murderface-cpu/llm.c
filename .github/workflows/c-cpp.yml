name: llm.c CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [release, debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            libopenblas-dev

      - name: Show compiler info
        run: |
          gcc --version
          make --version

      - name: Build project
        run: |
          if [ "${{ matrix.build_type }}" = "release" ]; then
            make all
          else
            make debug
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.build_type }}" = "release" ]; then
            make test
          else
            make test_debug
          fi

      - name: Run benchmarks
        if: matrix.build_type == 'release'
        run: make bench

      - name: Verify binaries
        run: |
          ls -lah build/
          test -f build/train

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-c-${{ matrix.build_type }}
          path: build/

  sanitizer-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libopenblas-dev

      - name: Build sanitizer targets
        run: make debug

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: make test_debug
